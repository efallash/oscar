      right_arm_Art3_Pitch: {p: 100.0, i: 1000.0, d: 5.0, i_clamp: 7.0}

      right_arm_Art4_Yaw: {p: 200.0, i: 10.0, d: 1.0, i_clamp: 1.0}

      right_arm_Art5_Pitch: {p: 20.0, i: 10.0, d: 0.0, i_clamp: 5.0}

